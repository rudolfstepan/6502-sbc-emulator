# Commodore 64 (PAL)
[machine]
type = c64
basic = roms/c64/basic.rom
kernal = roms/c64/kernal.rom
chargen = roms/c64/chargen.rom

[floppy]
device = 8 # 8 to 11
image = # Optional startup disk. An empty value leaves the drive empty.

[video]
window_scale = 1

[cpu]
speed_hz = 985248
debug = 0
trace = 0
trace_file =
profile = 0

[joystick]
port = 0 # 0 = disabled, 1 or 2 selects the C64 control port.
