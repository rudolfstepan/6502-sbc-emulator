# Native MOS 6581 playback from a 16 KiB FPGA split ROM.
[cpu]
speed_hz = 27000000
model = 65c02

[video]
window_scale = 1

[sram]
base = 0x0000
size = 0x8000

[rom]
base = 0xA000
size = 0x3000
file = roms/sid/fpga/sound_commando.rom
offset = 0x0000

[rom]
base = 0xF000
size = 0x1000
file = roms/sid/fpga/sound_commando.rom
offset = 0x3000
